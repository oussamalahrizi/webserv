server
{
	host localhost;
	listen 17000;
	root www;
	index index.html index.php index.py;
	
	server_name localhost oussama; 
	
	location /red
	{
		return /;
	}
	
	location /py
	{
		allow GET POST;
		cgi py;
		cgi_path /usr/bin/python3;
		root /cgi-bin;
	}

	location /other
	{
		allow GET POST DELETE;
		autoindex on;
		upload /videos;
		root /videos;
	}
	
	location /deny
	{
		allow NONE;
	}
}

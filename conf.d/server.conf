

server
{
	# wqdqdwq
	host 127.0.0.1;
	listen 8080;
	root www;
	index index.html;
	
	location /cgi-bin
	{
		allow GET;
		cgi php;
		cgi_path /bin/php-cgi;
	}

	location /other
	{
		root /nfs/homes/olahrizi;
		autoindex off;
		allow GET;
	}

	location /deny
	{
		allow POST;
		upload /videos;
		return /images/image.png;
	}
}

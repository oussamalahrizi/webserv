

server
{
	host localhost;
	listen 8080;
	root www;
	index index.html;
	
	location /cgi-bin
	{
		allow GET POST;
		cgi php;
		cgi_path /bin/php-cgi;
	}

	location /text
	{
		allow DELETE;
		# return 301 /other; this return will delete the file uploaded
	}
	location /other
	{
		allow DELETE GET;
		root /videos;
		autoindex on;
	}
}

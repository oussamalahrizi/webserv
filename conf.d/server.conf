

server
{
	host localhost;
	listen 8080;
	root www;
	index index.html index?html;
	
	location /cgi-bin
	{
		allow GET POST;
		cgi php;
		cgi_path /bin/php-cgi;
	}

	
	location /other
	{
		root /videos;
		return 302 /;
	}

	# location /videos
	# {
	# 	allow DELETE GET POST;
	# 	autoindex on;
	# 	upload /videos;
	# }
}

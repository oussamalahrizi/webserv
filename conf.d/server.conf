server
{
	host localhost;
	listen 17000;
	root www;
	index index.html index.php index.py;
	
	server_name localhost oussama; 
	
	location /cgi-bin
	{
		allow GET POST;
		cgi php;
		cgi_path /usr/bin/php-cgi;
		root /wordpress;
	}
	location /py
	{
		allow GET POST;
		cgi py;
		cgi_path /usr/bin/python3;
		root /cgi-bin;
	}

	location /other
	{
		allow GET POST DELETE;
		autoindex on;
	}
	
	location /deny
	{
		allow NONE;
	}
}

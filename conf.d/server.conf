server
{
	host localhost;
	listen 17000;
	root www;
	index index.html index.py;
	
	server_name localhost oussama;
	error_page 403 errors/403.html;
	error_page 502 errors/502.html;
	
	
	location /py
	{
		cgi py;
		cgi_path /usr/bin/python3;
		allow GET POST;
		root /cgi-bin;
	}

	location /other
	{
		allow GET POST DELETE;
		autoindex on;
		upload /videos;
		root /videos;
	}
	
	location /deny
	{
		allow NONE;
	}
}
